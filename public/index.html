<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中一</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#141a2b;--mut:#6b7488;--line:#e6e9f0;--acc:#2f6bff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f1c;--card:#141a2c;--ink:#eef2fb;--mut:#8792ad;--line:#232b42;--acc:#7fb0ff}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding:56px 16px 80px}
h1{font-size:44px;font-weight:900;letter-spacing:.04em}
.sub{color:var(--mut);margin-top:6px;font-size:16px}
h2{font-size:15px;color:var(--mut);font-weight:700;letter-spacing:.12em;margin:44px 0 14px}
.list{display:grid;gap:12px}
a.item{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
a.item:hover{transform:translateY(-2px);border-color:var(--acc)}
.ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-size:20px}
.t{font-size:18px;font-weight:700}
.d{color:var(--mut);font-size:14px;margin-top:3px}
.go{margin-left:auto;color:var(--mut);font-size:22px}
.empty{color:var(--mut);padding:40px 0;text-align:center}
footer{margin-top:60px;text-align:center}
footer a{color:var(--mut);font-size:13px;text-decoration:none;opacity:.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>中一</h1>
  <div class="sub">香港中一 · 自學課程</div>
  <div id="root"><div class="empty">載入中…</div></div>
  <footer><a href="/admin">管理</a></footer>
</div>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
fetch('/api/lessons').then(r => r.json()).then(({ subjects, lessons }) => {
  const root = document.getElementById('root');
  if (!lessons.length) { root.innerHTML = '<div class="empty">暫時未有課件</div>'; return; }
  root.innerHTML = subjects.map(s => {
    const items = lessons.filter(l => l.subject === s);
    if (!items.length) return '';
    return `<h2>${esc(s)}</h2><div class="list">` + items.map(l =>
      `<a class="item" href="/lesson/${l.id}/"><span class="ic">▶</span><span><div class="t">${esc(l.title)}</div>${l.desc ? `<div class="d">${esc(l.desc)}</div>` : ''}</span><span class="go">›</span></a>`
    ).join('') + '</div>';
  }).join('');
}).catch(() => { document.getElementById('root').innerHTML = '<div class="empty">載入失敗，請重新整理</div>'; });
</script>
</body>
</html>
