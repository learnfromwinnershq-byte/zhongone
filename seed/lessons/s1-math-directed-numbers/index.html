<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directed Numbers × ÷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+HK:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#0a0f1e; --ink:#eef2fb; --muted:#8792ad; --faint:rgba(255,255,255,.05);
  --pos:#3ee0a8; --neg:#ff6b81; --acc:#ffcf6b; --blue:#86b4ff;
  --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.11);
  --posbg:rgba(62,224,168,.14); --negbg:rgba(255,107,129,.14); --accbg:rgba(255,207,107,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--ink);overflow:hidden;
  font-family:Inter,"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif}
button{font:inherit;color:inherit}
#player{position:fixed;inset:0;background:#04060c;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:center;
  background:radial-gradient(1100px 700px at 25% 15%,#15224a 0%,transparent 62%),
             radial-gradient(900px 620px at 88% 92%,#1c1642 0%,transparent 60%),var(--bg)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--faint) 1px,transparent 1px),linear-gradient(90deg,var(--faint) 1px,transparent 1px);
  background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 78%)}
#layer{position:absolute;inset:0}
.scene{position:absolute;inset:0;transition:opacity .45s ease}
.scene.leaving{opacity:0}
.el{position:absolute;white-space:nowrap;
  transition:left .8s cubic-bezier(.2,.8,.2,1),top .8s cubic-bezier(.2,.8,.2,1),opacity .55s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
[k]{transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1),color .4s,background-color .4s,box-shadow .4s,border-color .4s}
.instant,.instant *{transition:none!important;animation:none!important}
.bump{animation:bump .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes bump{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---------- HUD ---------- */
#hud{position:absolute;left:64px;top:46px;display:flex;align-items:center;gap:16px;font-size:26px;color:var(--muted);transition:opacity .4s}
#hud .no{font-weight:800;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:4px 14px;font-variant-numeric:tabular-nums}
#hud .nm{font-family:"Noto Sans HK",Inter,sans-serif;font-weight:500;letter-spacing:.02em}
#brand{position:absolute;right:64px;top:52px;font-size:22px;letter-spacing:.18em;color:rgba(255,255,255,.28);font-weight:600}
#think{position:absolute;right:70px;top:110px;width:170px;height:170px;opacity:0;transform:scale(.8);transition:opacity .35s,transform .35s}
#think.on{opacity:1;transform:scale(1)}
#think svg{position:absolute;inset:0;transform:rotate(-90deg)}
#think .num{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
#think .cap{position:absolute;left:0;right:0;bottom:-44px;text-align:center;font-size:26px;color:var(--acc);font-family:"Noto Sans HK";letter-spacing:.1em}
#sub{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1640px;width:max-content;text-align:center;
  font-family:"Noto Sans HK",Inter,sans-serif;font-size:46px;font-weight:500;line-height:1.38;color:#fff;
  background:rgba(4,7,16,.74);border:1px solid rgba(255,255,255,.07);padding:14px 36px 16px;border-radius:18px;
  box-shadow:0 10px 40px rgba(0,0,0,.35);transition:opacity .25s,transform .3s}
#sub.empty{opacity:0}
#sub.think{color:var(--acc);background:rgba(40,30,8,.7)}
#sub .en{color:#bcd4ff;font-family:Inter,sans-serif;font-weight:600}
#sub .p{color:var(--pos);font-weight:700}
#sub .n{color:var(--neg);font-weight:700}
#player.ui #sub{transform:translateX(-50%) translateY(-58px)}
#player.nocc #sub{display:none}

/* ---------- typography & math ---------- */
.zh{font-family:"Noto Sans HK",Inter,sans-serif}
.hd{font-family:"Noto Sans HK",Inter,sans-serif;font-size:56px;font-weight:700;letter-spacing:.01em}
.hd small{font-size:.6em;color:var(--muted);font-weight:500;margin-left:.5em}
.eq{display:flex;align-items:center;gap:.16em;font-size:104px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eq.md{font-size:80px}.eq.sm{font-size:60px}.eq.xs{font-size:48px}
.op{color:var(--muted);font-weight:400;margin:0 .06em}
.op.ghost{color:var(--acc);font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}.acc{color:var(--acc)}.mut{color:var(--muted)}
.dn{position:relative;display:inline-flex;align-items:center}
.sg{display:inline-block;border-radius:.18em;padding:.02em .05em;line-height:.8}
.sg.pos{color:var(--pos)}.sg.neg{color:var(--neg)}
.sg.ring{box-shadow:0 0 0 .04em currentColor,0 0 .35em currentColor}
.sg.pos.ring{background:var(--posbg)}.sg.neg.ring{background:var(--negbg)}
.badge{position:absolute;top:-.42em;right:-.18em;width:1.45em;height:1.45em;font-size:.32em;border-radius:50%;
  display:grid;place-items:center;background:var(--neg);color:#2a0910;font-weight:800;box-shadow:0 4px 18px rgba(255,107,129,.5)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.6em;line-height:1.08;margin:0 .06em}
.frac>span:first-child{border-bottom:.075em solid currentColor;padding:0 .14em .02em}
.frac>span:last-child{padding:.02em .14em 0}
.frac.big{font-size:.85em}
.bp{font-size:1.45em;font-weight:200;line-height:1;transform:translateY(-.05em)}
.cx{position:relative;display:inline-block}
.cx::after{content:"";position:absolute;left:-12%;right:-12%;top:50%;height:.09em;background:var(--neg);border-radius:1em;transform:rotate(-28deg) scaleX(0);transition:transform .45s}
.cx.x{color:var(--muted)}
.cx.x::after{transform:rotate(-28deg) scaleX(1)}
.cx::before{content:attr(data-r);position:absolute;right:-.6em;top:-.72em;font-size:.68em;color:var(--acc);font-weight:800;opacity:0;transition:opacity .4s .25s}
.cx.dnm::before{top:auto;bottom:-.78em}
.cx.x::before{opacity:1}
.res{display:inline-flex;align-items:center;gap:.16em}
.chip{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;font-weight:700;line-height:1}
.chip.pos{background:var(--posbg);color:var(--pos);box-shadow:inset 0 0 0 .05em var(--pos)}
.chip.neg{background:var(--negbg);color:var(--neg);box-shadow:inset 0 0 0 .05em var(--neg)}
.chip.big{font-size:84px}
.dim{opacity:.32!important}
.box{border-radius:.18em;box-shadow:0 0 0 .05em var(--acc),0 0 .6em rgba(255,207,107,.35);background:var(--accbg)}
.ghosty{opacity:.55}

/* ---------- components ---------- */
.titleblk{text-align:center}
.kicker{font-size:28px;letter-spacing:.32em;color:var(--blue);font-weight:700;margin-bottom:22px}
.h1{font-size:104px;font-weight:800;letter-spacing:-.025em;line-height:1.04}
.h1.sub2{color:rgba(255,255,255,.62);font-weight:700}
.zhline{margin-top:26px;font-family:"Noto Sans HK";font-size:46px;color:var(--muted);letter-spacing:.12em}
.stepcard{width:520px;padding:38px 44px;border-radius:30px;background:var(--card);border:1px solid var(--line);text-align:center;transition:box-shadow .5s,border-color .5s}
.stepno{font-size:24px;letter-spacing:.3em;color:var(--muted);font-weight:700}
.stepbig{font-size:92px;font-weight:800;letter-spacing:.02em;margin:6px 0 4px}
.stepcard.sign .stepbig{background:linear-gradient(90deg,var(--pos),var(--neg));-webkit-background-clip:text;background-clip:text;color:transparent}
.stepcard.num .stepbig{color:var(--acc)}
.stepzh{font-family:"Noto Sans HK";font-size:38px;color:#cfd6e6}
.glow .stepcard.sign{border-color:rgba(134,180,255,.6);box-shadow:0 0 60px rgba(134,180,255,.25)}
.glow .stepcard.num{border-color:rgba(255,207,107,.6);box-shadow:0 0 60px rgba(255,207,107,.22)}
.bigarrow{font-size:96px;color:var(--muted)}

.builder{display:flex;align-items:flex-end;gap:26px}
.bslot{display:flex;flex-direction:column;align-items:center;gap:14px}
.blab{font-size:26px;letter-spacing:.16em;font-weight:700;color:var(--muted)}
.blab b{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;margin-right:8px;letter-spacing:0}
.bval{min-width:180px;height:160px;padding:0 30px;border-radius:26px;border:3px dashed rgba(255,255,255,.18);display:grid;place-items:center;
  font-size:100px;font-weight:700;color:rgba(255,255,255,.3);font-variant-numeric:tabular-nums}
.bsign.pos{color:var(--pos);border:3px solid var(--pos);background:var(--posbg)}
.bsign.neg{color:var(--neg);border:3px solid var(--neg);background:var(--negbg)}
.bnum.on{color:#fff;border:3px solid var(--acc);background:var(--accbg)}
.bplus{font-size:60px;color:var(--muted);padding-bottom:44px}

.ptable{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:110px 160px 70px 200px 70px 180px 120px;align-items:center;height:96px;font-size:68px;font-weight:600;font-variant-numeric:tabular-nums}
.prow>span{text-align:center}
.pm,.pp{font-size:34px!important;color:var(--acc);transform:translateY(-48px);font-weight:700}
.pr.pos{color:var(--pos)}
.prow.good{background:linear-gradient(90deg,transparent,rgba(62,224,168,.12),transparent);border-radius:20px}
.arrowbox{color:var(--pos);filter:drop-shadow(0 0 30px rgba(62,224,168,.35))}
.arrowbox.neg{color:var(--neg);filter:drop-shadow(0 0 30px rgba(255,107,129,.35))}
.lab{font-family:"Noto Sans HK";font-size:58px;font-weight:700;color:var(--pos)}
.lab.neg{color:var(--neg)}

.g2{display:grid;grid-template-columns:auto auto auto;gap:46px 70px;align-items:center}
.cell{display:flex;align-items:center;gap:20px;font-size:72px;padding:22px 34px;border-radius:26px;background:var(--card);border:1px solid var(--line)}
.glab{font-size:44px;font-weight:600}
.glab b{font-weight:800}
.banner{display:flex;gap:60px;align-items:center;font-family:"Noto Sans HK";font-size:56px;font-weight:800;padding:26px 60px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.calc{font-size:60px;font-weight:600;color:#dfe5f3;font-variant-numeric:tabular-nums}
.calc .lbl{display:block;font-size:24px;letter-spacing:.2em;color:var(--muted);margin-bottom:10px;font-weight:700}
.tag{font-size:34px;font-weight:700;padding:8px 22px;border-radius:999px;margin-left:30px;letter-spacing:.02em}
.tag.p{background:var(--posbg);color:var(--pos)}.tag.n{background:var(--negbg);color:var(--neg)}
.hint{display:flex;align-items:center;gap:22px;font-size:32px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.pill{padding:10px 26px;border-radius:999px;border:2px solid var(--line);color:#fff}
.pill.s{border-color:rgba(134,180,255,.6)}.pill.n{border-color:rgba(255,207,107,.6)}

.qlist{display:flex;flex-direction:column;gap:26px}
.qrow{display:grid;grid-template-columns:560px 150px 340px;align-items:center;font-size:66px;font-weight:600;padding:14px 34px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.qrow .chip{font-size:70px}
.qans{font-size:60px;color:#dfe5f3}

.rulecard{display:flex;flex-direction:column;gap:22px;padding:40px 60px;border-radius:32px;background:var(--card);border:1px solid var(--line)}
.rline{display:flex;align-items:center;gap:30px;font-family:"Noto Sans HK";font-size:54px;font-weight:700}
.rline .k{font-family:Inter;font-weight:800;padding:4px 20px;border-radius:14px;background:rgba(255,255,255,.08)}
.pairrow{display:flex;align-items:center;gap:30px}
.pairwrap{position:relative;display:inline-flex;gap:30px}
.grp{position:absolute;left:-14px;right:-14px;top:100%;margin-top:18px;border-top:5px solid var(--pos);text-align:center;color:var(--pos);font-family:"Noto Sans HK";font-size:38px;font-weight:700;padding-top:8px;border-radius:4px}
.arrowto{display:inline-flex;align-items:center;gap:30px;font-size:84px;color:var(--muted)}
.tip{position:absolute;left:50%;bottom:118%;transform:translateX(-50%);font-family:"Noto Sans HK";font-size:30px;font-weight:700;color:#2a0910;background:var(--neg);padding:6px 16px;border-radius:12px;white-space:nowrap}
.front{font-size:1.05em}
.lr{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:34px;font-weight:700;color:var(--acc);letter-spacing:.1em}
.lrline{width:1200px;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,var(--acc));position:relative}
.lrline::after{content:"";position:absolute;right:-6px;top:50%;width:26px;height:26px;border-top:6px solid var(--acc);border-right:6px solid var(--acc);transform:translateY(-50%) rotate(45deg)}
.steps{display:flex;flex-direction:column;gap:24px}
.sline{display:flex;align-items:center;gap:24px;font-size:64px;font-weight:600;font-variant-numeric:tabular-nums}
.sline .no{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.1);font-size:30px;font-weight:800}
.card{padding:34px 46px;border-radius:30px;background:var(--card);border:1px solid var(--line);white-space:normal}
.card.wrongc{border-color:rgba(255,107,129,.45);background:rgba(255,107,129,.06)}
.card.rightc{border-color:rgba(62,224,168,.45);background:rgba(62,224,168,.06)}
.ctitle{font-family:"Noto Sans HK";font-size:40px;font-weight:800;margin-bottom:18px}
.wrongc .ctitle{color:var(--neg)}.rightc .ctitle{color:var(--pos)}
.cl{font-size:52px;font-weight:600;margin:10px 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.verdict{font-family:"Noto Sans HK";font-size:40px;font-weight:800;margin-top:12px}
.pri{display:flex;align-items:center;gap:30px}
.pitem{font-size:48px;font-weight:700;padding:22px 40px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.pitem b{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#231a05;margin-right:16px;font-size:32px}
.parr{font-size:56px;color:var(--muted)}
.mlist{display:flex;flex-direction:column;gap:20px;width:1640px}
.mrow{display:grid;grid-template-columns:70px 720px 330px 1fr;align-items:center;font-size:46px;font-weight:600;padding:16px 30px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.mno{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:rgba(255,107,129,.18);color:var(--neg);font-size:28px;font-weight:800}
.mw s{color:var(--neg);text-decoration-thickness:4px}
.mf{color:var(--pos);font-weight:700}
.mwhy{font-family:"Noto Sans HK";font-size:36px;color:#cfd6e6;font-weight:500}
.ccard{width:520px;min-height:430px;padding:40px 44px;border-radius:32px;background:var(--card);border:1px solid var(--line);white-space:normal;text-align:center}
.ccard .ic{font-size:30px;letter-spacing:.2em;font-weight:800;color:var(--acc);margin-bottom:16px}
.ccard h3{font-family:"Noto Sans HK";font-size:50px;font-weight:800;margin-bottom:28px}
.ccard .body{font-size:42px;font-weight:600;line-height:1.6;color:#dfe5f3}
.pz{display:flex;align-items:center;gap:18px;font-size:34px;font-weight:800;letter-spacing:.2em;color:var(--acc)}
.pz i{display:inline-block;width:14px;height:40px;border-left:10px solid var(--acc);border-right:10px solid var(--acc);width:34px}
.wl{font-size:54px;font-weight:600;margin:12px 0;font-variant-numeric:tabular-nums}
.slist{display:flex;flex-direction:column;gap:22px;width:1500px}
.srow{display:flex;align-items:center;gap:30px;font-family:"Noto Sans HK";font-size:48px;font-weight:700;padding:22px 40px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.srow .n{display:inline-grid;place-items:center;flex:none;width:64px;height:64px;border-radius:18px;background:rgba(134,180,255,.16);color:var(--blue);font-family:Inter;font-weight:800}
.srow .en{font-family:Inter;color:#bcd4ff}
.outro{font-family:"Noto Sans HK";font-size:72px;font-weight:900;letter-spacing:.06em}

/* ---------- controls ---------- */
#controls{position:absolute;left:0;right:0;bottom:0;padding:40px 28px 16px;background:linear-gradient(transparent,rgba(0,0,0,.78));opacity:0;transition:opacity .3s;z-index:5}
#player.ui #controls{opacity:1}
#bar{position:relative;height:22px;cursor:pointer;display:flex;align-items:center}
#track{position:absolute;left:0;right:0;height:5px;border-radius:5px;background:rgba(255,255,255,.22);transition:height .15s}
#bar:hover #track{height:8px}
#fill{position:absolute;left:0;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--pos))}
#knob{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.mk{position:absolute;top:0;width:3px;height:100%;background:rgba(0,0,0,.6)}
#tipbox{position:absolute;bottom:30px;transform:translateX(-50%);background:rgba(10,14,28,.95);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:13px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
#bar:hover #tipbox{opacity:1}
.crow{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:14px}
.cbtn{width:42px;height:42px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer;opacity:.92}
.cbtn:hover{background:rgba(255,255,255,.12)}
.cbtn svg{width:24px;height:24px;fill:#fff}
.cbtn.off{opacity:.4}
#time{font-variant-numeric:tabular-nums;color:#dfe5f3;margin-left:8px;min-width:110px}
#chname{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:12px}
#settings{position:absolute;right:24px;bottom:96px;width:330px;background:rgba(12,16,30,.97);border:1px solid var(--line);border-radius:14px;padding:16px;z-index:6;font-size:14px;display:none}
#settings.open{display:block}
#settings label{display:block;color:var(--muted);margin:10px 0 6px;font-size:12px;letter-spacing:.08em}
#settings select{width:100%;background:#1a2036;color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--line);background:#1a2036;cursor:pointer}
.seg button.on{background:var(--blue);color:#0a1020;font-weight:700;border-color:var(--blue)}
#vnote{color:var(--muted);font-size:12px;line-height:1.5;margin-top:8px}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:8;
  background:radial-gradient(ellipse at center,rgba(8,12,26,.6),rgba(3,5,12,.94));text-align:center;padding:16px}
.overlay.hide{display:none}
.ov-k{font-size:clamp(11px,1.4vw,16px);letter-spacing:.3em;color:var(--blue);font-weight:700}
.ov-t{font-size:clamp(28px,5vw,64px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ov-z{font-family:"Noto Sans HK";font-size:clamp(16px,2.2vw,28px);color:var(--muted);letter-spacing:.1em}
.bigplay{width:clamp(76px,9vw,120px);height:clamp(76px,9vw,120px);border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--pos));
  display:grid;place-items:center;box-shadow:0 10px 50px rgba(62,224,168,.35);transition:transform .2s}
.bigplay:hover{transform:scale(1.06)}
.bigplay svg{width:42%;height:42%;fill:#06101c;margin-left:6%}
.ov-v{font-size:clamp(12px,1.3vw,15px);color:var(--muted);max-width:640px;line-height:1.6}
.ov-v b{color:#dfe5f3}
.ov-keys{font-size:12px;color:rgba(255,255,255,.4)}
.ov-sum{font-family:"Noto Sans HK";font-size:clamp(15px,2vw,24px);line-height:1.8;color:#dfe5f3}
</style>
</head>
<body>
<div id="player">
  <div id="stage">
    <div id="layer"></div>
    <div id="hud"><span class="no" id="hudNo">01</span><span class="nm" id="hudNm"></span></div>
    <div id="brand">S.1 MATHS · 2.3</div>
    <div id="think">

<script>
/* =====================================================================
   1. CONTENT HELPERS
   ===================================================================== */
const M = '−';
const sg = (s, k) => `<span class="sg ${s === '+' ? 'pos' : 'neg'}"${k ? ` k="${k}"` : ''}>${s === '+' ? '+' : M}</span>`;
const badge = b => b ? `<span class="badge" k="${b[0]}" h>${b[1]}</span>` : '';
const dn = (v, k, b) => `<span class="dn"${k ? ` k="${k}"` : ''}>(${sg(v[0], k ? k + 's' : null)}${v.slice(1)})${badge(b)}</span>`;
const fr = (a, b, cls) => `<span class="frac${cls ? ' ' + cls : ''}"><span>${a}</span><span>${b}</span></span>`;
const sf = (s, a, b, k, bd) => `<span class="dn"${k ? ` k="${k}"` : ''}><span class="bp">(</span>${sg(s, k ? k + 's' : null)}${fr(a, b)}<span class="bp">)</span>${badge(bd)}</span>`;
const X = '<span class="op">×</span>', D = '<span class="op">÷</span>', EQ = '<span class="op">=</span>';
const res = (k, v, cls) => `<span class="res" k="${k}" h>${EQ}<span class="${cls}">${v}</span></span>`;
const cx = (v, r, k, dnm) => `<span class="cx${dnm ? ' dnm' : ''}" k="${k}" data-r="${r}">${v}</span>`;
const chip = (s, big) => `<span class="chip ${s === '+' ? 'pos' : 'neg'}${big ? ' big' : ''}">${s === '+' ? '+' : M}</span>`;
const builder = p => `<div class="builder"><div class="bslot"><div class="blab"><b>1</b>SIGN</div><div class="bval bsign" k="${p}s">?</div></div><div class="bplus">→</div><div class="bslot"><div class="blab"><b>2</b>NUMBER</div><div class="bval bnum" k="${p}n">?</div></div></div>`;
const stepcard = (n, big, zh, kind) => `<div class="stepcard ${kind}"><div class="stepno">STEP ${n}</div><div class="stepbig">${big}</div><div class="stepzh">${zh}</div></div>`;
const hint = `<div class="hint"><span class="pill s">① SIGN</span>→<span class="pill n">② NUMBER</span></div>`;
// builder state shortcuts
const SP = p => ({ set: `${p}s.+pos`, mv: { [p + 's']: '+' } });
const SN = p => ({ set: `${p}s.+neg`, mv: { [p + 's']: M } });
const NUM = (p, v) => ({ set: `${p}n.+on`, mv: { [p + 'n']: v } });
const RST = p => ({ set: `${p}s.-pos ${p}s.-neg ${p}n.-on`, mv: { [p + 's']: '?', [p + 'n']: '?' } });
// merge several {set,mv} pieces + extra fields into one cue
const C = (base, ...parts) => {
  const c = { ...base }; const sets = [].concat(base.set || []); const mvs = [].concat(base.mv || []);
  parts.forEach(p => { if (p.set) sets.push(p.set); if (p.mv) mvs.push(p.mv); });
  c.set = sets; c.mv = mvs; return c;
};
const ARROW = `<svg width="560" height="200" viewBox="0 0 560 200"><path d="M30 100 H470" stroke="currentColor" stroke-width="26" stroke-linecap="round"/><path d="M405 32 L525 100 L405 168" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const prow = (i, a, r) => `<div class="prow" k="r${i}" h><span class="pm" k="m${i}" h>${i > 1 ? M + '1' : ''}</span><span>${a}</span><span class="op">×</span><span>(${M}2)</span><span class="op">=</span><span class="pr" k="v${i}">${r}</span><span class="pp" k="p${i}" h>${i > 1 ? '+2' : ''}</span></div>`;
const cell = (k, a, b, r) => `<div class="cell" k="${k}" h>${chip(a)}<span class="op">×</span>${chip(b)}<span class="op">=</span>${chip(r)}</div>`;
const qrow = (i, e, s, a) => `<div class="qrow" k="q${i}" h><span>${e}</span><span class="chip ${s === '+' ? 'pos' : 'neg'}" k="s${i}" h>${s === '+' ? '+' : M}</span><span class="qans" k="a${i}" h>= <span class="${s === '+' ? 'pos' : 'neg'}">${a}</span></span></div>`;
const front = (k, b, tip) => `<span class="dn"><span class="sg neg front" k="${k}">${M}</span>${tip ? `<span class="tip" k="${tip}" h>最易漏！</span>` : ''}${badge(b)}</span>`;
const mrow = (i, w, f, why) => `<div class="mrow" k="r${i}" h><span class="mno">${i}</span><span class="mw">${w}</span><span class="mf" k="f${i}" h>✓ ${f}</span><span class="mwhy" k="y${i}" h>${why}</span></div>`;

/* =====================================================================
   2. LESSON SCRIPT — scenes → cues (narration = subtitle)

   set/mv (stage state changes), at (timed sub-steps), think (silent pause sec)
   ===================================================================== */
const SCENES = [
/* ---------------- 00 INTRO ---------------- */
{ ch: '開場：今日學咩', els: [
  { k: 'title', x: 960, y: 420, html: `<div class="titleblk"><div class="kicker">S.1 MATHEMATICS · 2.3</div><div class="h1">Multiplication &amp; Division</div><div class="h1 sub2">of Directed Numbers</div><div class="zhline">有向數嘅乘法 同 除法</div></div>` },
  { k: 'ex1', x: 560, y: 780, html: `<div class="eq md ghosty">${dn('-3')}${X}${dn('-6')}</div>` },
  { k: 'ex2', x: 1360, y: 780, html: `<div class="eq md ghosty">${dn('+24')}${D}${dn('-3')}</div>` },
  { k: 'st1', x: 620, y: 650, html: stepcard(1, 'SIGN', '先決定 + 定 −', 'sign') },
  { k: 'arr', x: 960, y: 650, html: `<div class="bigarrow">→</div>` },
  { k: 'st2', x: 1300, y: 650, html: stepcard(2, 'NUMBER', '再計個數', 'num') },
 ], cues: [
  { sub: '今日我哋學有向數嘅 multiplication 同 division。', set: 'title', sfx: 'whoosh' },
  { sub: '即係正數同負數，一齊乘、一齊除。', set: 'ex1 ex2' },
  { sub: '成堂課其實得一個核心方法，記住佢就得。', set: '-ex1 -ex2', mv: { title: { y: 250, s: .74 } } },
  { sub: '第一步，唔好急住計，先睇 sign。', set: 'st1', sfx: 'pop' },
  { sub: '第二步，sign 決定咗之後，先至計個 number。', set: 'arr st2', sfx: 'pop' },
  { sub: 'Sign 同 number 分開處理，就唔會亂。', set: 'st1.+glow st2.+glow' },
 ]},

/* ---------------- 01 WHY: pattern ---------------- */
{ ch: '點解 負 × 負 = 正？', els: [
  { k: 'hd', x: 960, y: 140, html: `<div class="hd">點解 <span class="neg">負</span> × <span class="neg">負</span> = <span class="pos">正</span>？<small>睇 pattern</small></div>` },
  { k: 'tbl', x: 960, y: 530, html: `<div class="ptable">${prow(1, '3', M + '6')}${prow(2, '2', M + '4')}${prow(3, '1', M + '2')}${prow(4, '0', '0')}${prow(5, `(${M}1)`, '?')}${prow(6, `(${M}2)`, '?')}</div>` },
 ], cues: [

  { sub: '我哋睇一個 pattern。', set: 'tbl', min: 3.2, at: [{ t: .4, set: 'r1' }, { t: 1.0, set: 'r2' }, { t: 1.6, set: 'r3' }, { t: 2.2, set: 'r4' }] },
  { sub: '左邊每次細 1，答案就每次大 2。', at: [{ t: .3, set: 'm2 m3 m4' }, { t: 1.6, set: 'p2 p3 p4', sfx: 'pop' }] },
  { sub: '咁跟住落去，(−1) × (−2) 應該係幾多？', set: 'r5 m5' },
  { think: 3 },
  { sub: '上一行係 0，再大 2，就係 positive 2。', set: 'p5 v5.+pos', mv: { v5: '+2' }, sfx: 'ding' },
  { sub: '再落一行，(−2) × (−2)，就係 positive 4。', set: 'r6 m6', at: [{ t: 1.4, set: 'p6 v6.+pos', mv: { v6: '+4' }, sfx: 'pop' }] },
  { sub: '所以 negative 乘 negative，一定係 positive。', set: 'r5.+good r6.+good' },
 ]},

/* ---------------- 01b memory: flip ---------------- */
{ els: [
  { k: 'hd', x: 960, y: 140, html: `<div class="hd">記憶法：負號 = <span class="acc">掉頭</span></div>` },
  { k: 'arw', x: 960, y: 450, html: `<div class="arrowbox" k="ab">${ARROW}</div>` },
  { k: 'lab', x: 960, y: 680, html: `<div class="lab" k="lt">正數：向前</div>` },
  { k: 'eqs', x: 960, y: 800, html: `<div class="eq md">${chip('-')}${X}${chip('-')}${EQ}${chip('+')}</div>` },
 ], cues: [
  { sub: '仲有一個更易記嘅諗法。', set: 'hd arw lab' },
  { sub: '將每一個 negative sign，諗成「掉頭」。' },
  { sub: '掉頭一次，就向咗反方向，即係 negative。', set: 'ab.+neg lt.+neg', mv: { arw: { r: 180 }, lt: '掉頭 1 次 → negative' }, sfx: 'whoosh' },
  { sub: '再掉頭多一次，又轉返正，即係 positive。', set: 'ab.-neg lt.-neg', mv: { arw: { r: 360 }, lt: '掉頭 2 次 → positive' }, sfx: 'whoosh' },
  { sub: '兩個負號，掉頭兩次，返返原本方向。', set: 'eqs', sfx: 'ding' },
 ]},

/* ---------------- 02 two-number sign rule ---------------- */
{ ch: 'Sign Rule：兩個數', els: [
  { k: 'grid', x: 960, y: 420, html: `<div class="g2">${cell('c1', '+', '+', '+')}${cell('c2', '-', '-', '+')}<div class="glab pos" k="L1" h>same signs → <b>positive</b></div>${cell('c3', '+', '-', '-')}${cell('c4', '-', '+', '-')}<div class="glab neg" k="L2" h>different signs → <b>negative</b></div></div>` },
  { k: 'ban', x: 960, y: 760, html: `<div class="banner"><span>同號得<span class="pos">正</span></span><span class="mut">·</span><span>異號得<span class="neg">負</span></span></div>` },
 ], cues: [
  { sub: '兩個數相乘，sign 只有四種情況。', set: 'grid' },
  { sub: '正乘正，正。負乘負，都係正。', at: [{ t: .2, set: 'c1', sfx: 'pop' }, { t: 1.6, set: 'c2', sfx: 'pop' }] },
  { sub: '兩個 sign 一樣，same signs，所以答案一定係 positive。', set: 'L1' },
  { sub: '正乘負，負。負乘正，都係負。', at: [{ t: .2, set: 'c3', sfx: 'pop' }, { t: 1.6, set: 'c4', sfx: 'pop' }] },
  { sub: '兩個 sign 唔同，different signs，答案一定係 negative。', set: 'L2' },
  { sub: '一句講晒：同號得正，異號得負。', set: 'ban', sfx: 'ding' },
 ]},

/* ---------------- 02b worked examples ---------------- */
{ els: [
  { k: 'q', x: 960, y: 250, html: `<div class="eq">${dn('-18', 'x1')}${X}${dn('-4', 'x2')}${res('res', '72', 'pos')}</div>` },
  { k: 'q2', x: 960, y: 250, html: `<div class="eq">${dn('+14', 'y1')}<span class="op ghost" k="gx" h>×</span>${dn('-4', 'y2')}${res('res2', M + '56', 'neg')}</div>` },
  { k: 'bld', x: 700, y: 610, html: builder('b1') },
  { k: 'calc', x: 1340, y: 640, html: `<div class="calc"><span class="lbl">NUMBER</span>18 × 4 = 72</div>` },
  { k: 'calc2', x: 1340, y: 640, html: `<div class="calc"><span class="lbl">NUMBER</span>14 × 4 = 56</div>` },
 ], cues: [
  { sub: '用兩步法試吓：(−18) × (−4)。', set: 'q bld' },
  { sub: '第一步，先睇 sign：負同負，same signs。', set: 'x1s.+ring x2s.+ring' },
  C({ sub: '所以答案係 positive，先寫個正號。', sfx: 'pop' }, SP('b1')),
  { sub: '第二步，先至計 number：18 × 4 = 72。', set: 'calc', at: [{ t: 2.2, ...NUM('b1', '72'), sfx: 'pop' }] },
  { sub: '答案係 72。正數前面個正號，可以唔寫。', set: 'res', sfx: 'ding' },
  C({ sub: '下一題：(+14)(−4)。', set: '-q -calc q2' }, RST('b1')),
  { sub: '留意，兩個括號中間冇符號，即係乘。', set: 'gx gx.+pulse' },
  C({ sub: 'Sign：一正一負，different signs，所以係 negative。', set: 'gx.-pulse y1s.+ring y2s.+ring', sfx: 'pop' }, SN('b1')),
  C({ sub: 'Number：14 × 4 = 56。答案係 −56。', set: 'calc2 res2', sfx: 'ding' }, NUM('b1', '56')),
  { sub: 'Negative 嘅負號一定要寫，唔可以漏！', set: 'res2.+pulse' },
 ]},

/* ---------------- 03 practice: sign only ---------------- */
{ ch: '練習 ①：快速判斷 sign', els: [

  { k: 'list', x: 960, y: 530, html: `<div class="qlist">${qrow(1, `${dn('+9')}${dn('+21')}`, '+', '189')}${qrow(2, `${dn('-10')} × ${dn('-10')}`, '+', '100')}${qrow(3, `${dn('-9')} × ${dn('+7')}`, '-', M + '63')}${qrow(4, `${dn('+8')}${dn('-25')}`, '-', M + '200')}</div>` },
 ], cues: [
  { sub: '熱身：淨係判斷 sign，唔使計數。', set: 'hd list' },
  { sub: '第一題：(+9)(+21)。', set: 'q1' }, { think: 2.5 },
  { sub: '同號，positive。', set: 's1', sfx: 'ding' },
  { sub: '(−10) × (−10)。', set: 'q2' }, { think: 2.5 },
  { sub: '負同負，同號，positive。', set: 's2', sfx: 'ding' },
  { sub: '(−9) × (+7)。', set: 'q3' }, { think: 2.5 },
  { sub: '一正一負，異號，negative。', set: 's3', sfx: 'ding' },
  { sub: '(+8)(−25)。', set: 'q4' }, { think: 2.5 },
  { sub: '異號，negative。', set: 's4', sfx: 'ding' },
  { sub: 'Sign 搞掂，再計埋 number，就係完整答案。', at: [{ t: .3, set: 'a1' }, { t: .9, set: 'a2' }, { t: 1.5, set: 'a3' }, { t: 2.1, set: 'a4' }] },
 ]},

/* ---------------- 04 division ---------------- */
{ ch: 'Division：sign rule 一樣', els: [
  { k: 'hd', x: 960, y: 140, html: `<div class="hd">÷ 嘅 sign rule ＝ × 嘅 sign rule</div>` },
  { k: 'd1', x: 960, y: 330, html: `<div class="eq md">${dn('-24', 'p1')}${D}${dn('-3', 'p2')}${res('r1', '8', 'pos')}<span class="tag p" k="t1" h>same signs</span></div>` },
  { k: 'd2', x: 960, y: 500, html: `<div class="eq md">${dn('+24', 'q1')}${D}${dn('-3', 'q2')}${res('r2', M + '8', 'neg')}<span class="tag n" k="t2" h>different signs</span></div>` },
  { k: 'cmp', x: 960, y: 680, html: `<div class="banner"><span>× 同 ÷</span><span class="mut">:</span><span>同號得<span class="pos">正</span></span><span class="mut">·</span><span>異號得<span class="neg">負</span></span></div>` },
  { k: 'terms', x: 960, y: 810, html: `<div class="hint" style="letter-spacing:.02em"><span class="pill s">product = 乘出嚟嘅答案</span><span class="pill n">quotient = 除出嚟嘅答案</span></div>` },
 ], cues: [
  { sub: '去到 division，有個好消息。', set: 'hd' },

  { sub: '記住，multiplication 同 division 個 sign rule 其實係一樣。', set: 'cmp', sfx: 'ding' },
  { sub: '乘法嘅答案叫 product，除法嘅答案叫 quotient。', set: 'terms' },
 ]},

/* ---------------- 04b fraction bar ---------------- */
{ els: [

/* =====================================================================
   3. SPEECH TEXT + DURATION ESTIMATE
   ===================================================================== */
function strip(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent; }
function toSpeech(s) {
  return s
    .replace(/(\d+)\/(\d+)/g, (m, a, b) => `${b}分之${a}`)
    .replace(/\)\s*\(/g, ') 乘 (')
    .replace(/(\d)\s*\(/g, '$1 乘 (')
    .replace(/[\(\[]\s*\+/g, '正').replace(/[\(\[]\s*[−-]/g, '負')
    .replace(/[−-](?=\s*[\d\(\[負正])/g, '負').replace(/\+(?=\d)/g, '正')
    .replace(/[\(\)\[\]]/g, ' ')
    .replace(/×/g, ' 乘 ').replace(/÷/g, ' 除以 ').replace(/≈/g, ' 大約 ').replace(/=/g, ' 等於 ')
    .replace(/[✓✗→…「」]/g, '，').replace(/\s+/g, ' ').trim();
}
function est(s) {
  if (!s) return 0;
  const cjk = (s.match(/[㐀-鿿]/g) || []).length;
  const words = (s.match(/[A-Za-z]+/g) || []).length;
  let syl = 0; (s.match(/\d+(\.\d+)?/g) || []).forEach(n => syl += Math.min(n.replace('.', '').length * 1.6, 7));
  const punct = (s.match(/[，。！？：；,.!?]/g) || []).length;
  return 0.35 + cjk * 0.225 + words * 0.4 + syl * 0.2 + punct * 0.22;
}

/* =====================================================================
   4. TIMELINE BUILD
   ===================================================================== */
const CUES = []; let TOTAL = 0;
(function buildTimeline() {
  let T = 0, chNo = 0, prev = null;
  SCENES.forEach((sc, si) => {
    if (sc.ch) { chNo++; sc.chNo = chNo; sc.chName = sc.ch; } else { sc.chNo = prev.chNo; sc.chName = prev.chName; }
    sc.start = T; sc.steps = [];
    sc.cues.forEach(c => {
      c.scene = si;
      c.say = c.think ? '' : (c.say ?? toSpeech(c.sub));
      c.lastAt = c.at ? Math.max(...c.at.map(a => a.t)) : 0;
      c.dur = c.think ? c.think : Math.max(est(c.say) + 0.55, c.lastAt + 1.0, c.min || 0);
      c.start = T; c.end = T + c.dur; T = c.end;
      c.maxHold = est(c.say) * 1.3 + 4;
      c.idx = CUES.length; CUES.push(c);
      if (c.set || c.mv) sc.steps.push({ time: c.start, set: c.set, mv: c.mv });
      (c.at || []).forEach(a => sc.steps.push({ time: c.start + a.t, set: a.set, mv: a.mv, sfx: a.sfx }));
    });
    sc.steps.sort((a, b) => a.time - b.time);
    sc.end = T; prev = sc;
  });
  TOTAL = T;
})();

/* =====================================================================
   5. STAGE ENGINE (deterministic state → DOM, seekable)
   ===================================================================== */
const $ = id => document.getElementById(id);
const player = $('player'), stage = $('stage'), layer = $('layer');
let cur = null;           // current built scene
let instantNext = true;   // apply next render without transitions (after seek)

function buildScene(si) {
  const sc = SCENES[si];
  const box = document.createElement('div'); box.className = 'scene';
  const nodes = new Map(), init = new Map();
  sc.els.forEach(e => {
    const d = document.createElement('div');
    d.className = 'el' + (e.cls ? ' ' + e.cls : ''); d.innerHTML = e.html;
    d._top = true; d._base = d.className;
    nodes.set(e.k, d);
    init.set(e.k, { o: e.o ?? 0, x: e.x, y: e.y, s: e.s ?? 1, r: e.r || 0, dx: 0, dy: 0, c: new Set() });
    d.querySelectorAll('[k]').forEach(n => {
      const k = n.getAttribute('k');
      n._base = n.getAttribute('class') || ''; n._orig = n.innerHTML;
      nodes.set(k, n); init.set(k, { o: n.hasAttribute('h') ? 0 : 1, c: new Set() });
    });

  });
  return { si, sc, box, nodes, init, n: -1 };
}
function cloneState(init) { const st = new Map(); init.forEach((v, k) => st.set(k, { ...v, c: new Set(v.c) })); return st; }
function applyStep(st, step) {
  const sets = [].concat(step.set || []).join(' ').trim();
  if (sets) sets.split(/\s+/).forEach(tok => {
    let key, fn;
    const dot = tok.indexOf('.');
    if (dot > 0) { key = tok.slice(0, dot); const op = tok[dot + 1], cls = tok.slice(dot + 2); fn = s => op === '+' ? s.c.add(cls) : s.c.delete(cls); }
    else if (tok[0] === '-') { key = tok.slice(1); fn = s => s.o = 0; }
    else { key = tok; fn = s => s.o = 1; }
    const s = st.get(key); if (!s) { console.warn('missing key', key); return; } fn(s);
  });
  [].concat(step.mv || []).forEach(obj => {
    for (const key in obj) {
      const s = st.get(key); if (!s) { console.warn('missing key', key); continue; }
      const v = obj[key]; if (typeof v === 'string') s.t = v; else Object.assign(s, v);
    }

}
function applyDOM(S, st, instant) {
  if (instant) layer.classList.add('instant');
  S.nodes.forEach((node, key) => {
    const s = st.get(key);
    node.style.opacity = s.o;
    if (node._top) {
      node.style.left = s.x + 'px'; node.style.top = s.y + 'px';
      node.style.transform = `translate(-50%,-50%) translate(${s.dx || 0}px,${s.dy || 0}px) rotate(${s.r || 0}deg) scale(${s.s ?? 1})`;
    } else if (s.dx || s.dy || s.r || (s.s != null && s.s !== 1)) {
      node.style.transform = `translate(${s.dx || 0}px,${s.dy || 0}px) rotate(${s.r || 0}deg) scale(${s.s ?? 1})`;
    } else if (node.style.transform) node.style.transform = '';
    const cls = (node._base + ' ' + [...s.c].join(' ')).trim();
    if (node.getAttribute('class') !== cls) node.setAttribute('class', cls);
    const want = s.t !== undefined ? s.t : null;
    if (want !== null && node._t !== want) {
      node.innerHTML = want; node._t = want;
      if (!instant) { node.classList.remove('bump'); void node.offsetWidth; node.classList.add('bump'); }
    } else if (want === null && node._t !== undefined) { node.innerHTML = node._orig; node._t = undefined; }
  });

}
function switchScene(si, instant) {
  const old = cur;

    if (instant) old.box.remove();
    else { old.box.classList.add('leaving'); setTimeout(() => old.box.remove(), 500); }
  }

function stepCount(S, t) { let n = 0; for (const s of S.sc.steps) { if (s.time > t + 1e-6) break; n++; } return n; }
function renderStage(t, ci) {
  const cue = CUES[ci], instant = instantNext;
  if (!cur || cur.si !== cue.scene) switchScene(cue.scene, instant);
  const n = stepCount(cur, t);
  if (n !== cur.n) {
    const st = cloneState(cur.init);
    for (let i = 0; i < n; i++) applyStep(st, cur.sc.steps[i]);
    if (!instant && playing && n > cur.n && cur.n >= 0) for (let i = cur.n; i < n; i++) if (cur.sc.steps[i].sfx) SFX.play(cur.sc.steps[i].sfx);
    applyDOM(cur, st, instant);
    cur.n = n;
  }
  instantNext = false;
}

  load() {

    u.onend = u.onerror = () => { if (this.cur === u) this.speaking = false; };

/* =====================================================================
   7. SOUND FX (tiny WebAudio synth, very quiet)
   ===================================================================== */
const SFX = {
  ctx: null, on: true,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

    const c = this.ctx, t0 = c.currentTime;
    const tone = (f1, f2, d, g, type = 'sine', delay = 0) => {
      const o = c.createOscillator(), a = c.createGain(), t = t0 + delay;
      o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);

    else if (n === 'ding') { tone(880, 0, 0.55, 0.04); tone(1318, 0, 0.7, 0.028, 'sine', 0.09); }

      const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(400, t0); f.frequency.exponentialRampToValueAtTime(2400, t0 + len);

  if (!playing) return;
  if (natural && c.sfx) SFX.play(c.sfx);
  if (c.think && natural) SFX.play('tick');
  if (c.say && V.active()) { V.speak(c.say); spokenCue = ci; } else { spokenCue = -1; }
}
function frame(now) {
  const dt = lastFrame ? Math.min(0.1, (now - lastFrame) / 1000) : 0; lastFrame = now;
  if (playing) {
    const c = CUES[curCue];
    let mul = speed;
    // narration finished early → glide quickly to the end of this cue
    if (V.active() && spokenCue === curCue && !V.speaking && c.say && t < c.end - 0.4 && t >= c.start + c.lastAt) mul *= 3.5;
    let nt = t + dt * mul;
    // narration still talking → hold the clock at the end of the cue
    if (V.active() && spokenCue === curCue && V.speaking && nt >= c.end - 0.04) {
      nt = c.end - 0.04; holdAcc += dt;
      if (holdAcc > c.maxHold) { V.speaking = false; }
    }
    if (nt >= TOTAL) { nt = TOTAL - 0.001; t = nt; finish(); }
    else {
      t = nt;
      const ci = cueAt(t);
      if (ci !== curCue) enterCue(ci, true);
    }
  }
  render();
  requestAnimationFrame(frame);
}
let subCue = -1;
const EN_RE = /([A-Za-z][A-Za-z ]*[A-Za-z]|[A-Za-z])/g;
function subHTML(text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  return esc.replace(EN_RE, w => {
    const lw = w.toLowerCase();
    if (/^positive$/.test(lw)) return `<span class="p">${w}</span>`;
    if (/^negative$/.test(lw)) return `<span class="n">${w}</span>`;
    return `<span class="en">${w}</span>`;
  });
}
function render() {
  const ci = cueAt(t), c = CUES[ci];
  renderStage(t, ci);
  if (ci !== subCue) {
    subCue = ci; const el = $('sub');
    if (c.think) { el.className = 'think'; el.innerHTML = '⏸ 停一停，自己諗吓先'; }
    else if (c.sub) { el.className = ''; el.innerHTML = subHTML(c.sub); }
    else el.className = 'empty';
  }
  const th = $('think');
  if (c.think) {
    th.classList.add('on');
    const p = Math.min(1, (t - c.start) / c.dur), rem = Math.max(0, Math.ceil(c.end - t - 0.05));
    $('thinkArc').style.strokeDashoffset = (465 * p).toFixed(1);
    $('thinkNum').textContent = rem;
    if (playing && rem !== lastTick) { if (lastTick !== -1 && rem <= 3 && rem > 0) SFX.play('tick'); lastTick = rem; }
  } else th.classList.remove('on');
  const sc = SCENES[c.scene];
  $('hudNo').textContent = String(sc.chNo).padStart(2, '0'); $('hudNm').textContent = sc.chName;
  $('chname').textContent = sc.chName;
  const pct = (t / TOTAL) * 100;
  $('fill').style.width = pct + '%'; $('knob').style.left = pct + '%';
  $('time').textContent = fmt(t) + ' / ' + fmt(TOTAL);
}
function fmt(s) { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

/* =====================================================================
   9. CONTROLS
   ===================================================================== */
const ICON_PLAY = '<path d="M7 4l13 8-13 8z"/>', ICON_PAUSE = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
function setPlayIcon() { $('icPlay').innerHTML = playing ? ICON_PAUSE : ICON_PLAY; }
function play() {
  SFX.init();
  if (ended) { ended = false; $('endOv').classList.add('hide'); seek(0); }
  $('startOv').classList.add('hide');
  playing = true; setPlayIcon();
  const c = CUES[curCue];
  // resume at the start of the current sentence so voice & picture stay in sync
  if (c.say && V.active() && t - c.start > 0.3) { t = c.start; instantNext = true; }
  enterCue(curCue, false);
  poke();
}
function pause() { playing = false; V.cancel(); setPlayIcon(); poke(); }
function toggle() { playing ? pause() : play(); }
function seek(time, speak = true) {
  V.cancel();
  const ci = cueAt(Math.max(0, Math.min(TOTAL - 0.01, time)));
  t = CUES[ci].start; instantNext = true; curCue = ci; spokenCue = -1; holdAcc = 0;
  if (ended && t < TOTAL - 0.5) { ended = false; $('endOv').classList.add('hide'); }
  render();
  if (playing && speak) enterCue(ci, false);
}
function prevCue() { const c = CUES[curCue]; seek(t - c.start > 1.2 || curCue === 0 ? c.start : CUES[curCue - 1].start); }
function nextCue() { if (curCue < CUES.length - 1) seek(CUES[curCue + 1].start); }
function finish() { playing = false; ended = true; V.cancel(); setPlayIcon(); $('endOv').classList.remove('hide'); }
function restart() { ended = false; $('endOv').classList.add('hide'); seek(0); if (!playing) play(); }

$('startBtn').onclick = () => { V.speak(' '); play(); };
$('againBtn').onclick = restart;
$('bPlay').onclick = toggle; $('bReplay').onclick = restart; $('bPrev').onclick = prevCue; $('bNext').onclick = nextCue;
$('bCC').onclick = () => { player.classList.toggle('nocc'); $('bCC').classList.toggle('off'); };
$('bFS').onclick = toggleFS;
$('bSet').onclick = e => { e.stopPropagation(); $('settings').classList.toggle('open'); };
$('settings').onclick = e => e.stopPropagation();
stage.onclick = () => { if ($('settings').classList.contains('open')) { $('settings').classList.remove('open'); return; } toggle(); };
function toggleFS() {
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (player.requestFullscreen || player.webkitRequestFullscreen).call(player);
}
$('voiceSel').onchange = e => {
  V.userPicked = true; V.cancel();
  if (e.target.value === 'off') V.sel = null; else V.sel = V.voices[+e.target.value].v;
  populateVoices();
  if (playing) enterCue(curCue, false);
};
$('speedSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; speed = +b.dataset.v; [...$('speedSeg').children].forEach(x => x.classList.toggle('on', x === b)); if (playing && V.active()) { seek(CUES[curCue].start); } };
$('sfxSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; SFX.on = b.dataset.v === '1'; [...$('sfxSeg').children].forEach(x => x.classList.toggle('on', x === b)); };

// progress bar: drag to seek (snaps to sentence start)
const bar = $('bar');
let dragging = false;
function barTime(e) { const r = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * TOTAL; }
bar.addEventListener('pointerdown', e => { dragging = true; bar.setPointerCapture(e.pointerId); V.cancel(); seek(barTime(e), false); });
bar.addEventListener('pointermove', e => {
  const tm = barTime(e), c = CUES[cueAt(tm)], r = bar.getBoundingClientRect();
  const tip = $('tipbox'); tip.textContent = fmt(tm) + ' · ' + SCENES[c.scene].chName;
  tip.style.left = Math.max(60, Math.min(r.width - 60, e.clientX - r.left)) + 'px';
  if (dragging) seek(tm, false);
});
bar.addEventListener('pointerup', e => { if (!dragging) return; dragging = false; seek(barTime(e), true); });
// chapter markers
SCENES.forEach((sc, i) => { if (sc.ch && i > 0) { const m = document.createElement('div'); m.className = 'mk'; m.style.left = (sc.start / TOTAL * 100) + '%'; $('marks').appendChild(m); } });
$('marks').style.cssText = 'position:absolute;left:0;right:0;top:50%;height:8px;transform:translateY(-50%);pointer-events:none';

// keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); if (!$('startOv').classList.contains('hide')) { $('startBtn').click(); } else toggle(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevCue(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextCue(); }
  else if (e.key === 'f' || e.key === 'F') toggleFS();
  else if (e.key === 'c' || e.key === 'C') $('bCC').click();
  else if (e.key === 'Home') seek(0);
  poke();
});
// auto-hide UI
let uiTimer = 0;
function poke() { player.classList.add('ui'); clearTimeout(uiTimer); uiTimer = setTimeout(() => { if (playing && !dragging && !$('settings').classList.contains('open')) player.classList.remove('ui'); }, 2600); }
player.addEventListener('pointermove', poke);
player.style.cursor = 'default';

// stage scaling (16:9, letterboxed)
function fit() {
  const w = player.clientWidth, h = player.clientHeight, s = Math.min(w / 1920, h / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit); fit();

// init
if (V.ok) { V.load(); speechSynthesis.onvoiceschanged = () => V.load(); setTimeout(() => V.load(), 600); } else populateVoices();
curCue = 0; render(); poke();
requestAnimationFrame(frame);
window.__lesson = { SCENES, CUES, seek, get t() { return t; }, TOTAL };
</script>
</body>
